services:
  simulation:
    build:
      context: ../../../hydrus-software-stack
      dockerfile: docker/simulation/simulation.Dockerfile
    privileged: true
    runtime: nvidia
    environment:
      - DISPLAY=${DISPLAY}
      - PYTHONUNBUFFERED=1
    ulimits:
      nofile:
        soft: 1024
        hard: 524288
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ../../simulation/hydrus_sim_ros2:/home/ros2_ws/src/hydrus_sim_ros2
    stdin_open: true
    tty: true
